[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intel-capstone"
version = "0.1.0"
description = "Material delivery middleware prototype for the Intel capstone project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["capstone", "capstone.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
